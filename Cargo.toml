[package]
name = "aether-dcc-engine"
version = "2.0.0"
edition = "2021"
description = "AetherDCC Engine v2.0 — Production-grade Differential Contention Compute & Ternary AI Runtime"
license = "MIT"
readme = "README.md"
authors = ["AetherDCC Systems"]

[lib]
name = "aether_dcc"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "aether-studio"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = false
codegen-units = 1

[profile.test]
opt-level = 2
